name: Build and publish Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (for example 0.1.0)
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - development

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create clean source package
        shell: pwsh
        run: |
          $tagVersion = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.Substring(1) } else { '${{ inputs.version }}' }
          if ($tagVersion -notmatch '^\d+\.\d+\.\d+([.-][A-Za-z0-9.-]+)?$') { throw "Invalid version: $tagVersion" }
          $releaseChannel = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($tagVersion -match '(?i)(dev|alpha|beta|rc)') { 'development' } else { 'stable' }
          } else { '${{ inputs.channel }}' }
          if ($releaseChannel -notin @('stable', 'development')) { throw "Invalid release channel: $releaseChannel" }
          if ($releaseChannel -eq 'development' -and $tagVersion -notmatch '(?i)(dev|alpha|beta|rc)') { throw 'Development versions must include a suffix such as -dev.1.' }
          if ($releaseChannel -eq 'stable' -and $tagVersion -match '(?i)(dev|alpha|beta|rc)') { throw 'Prerelease suffixes require the development channel.' }
          Set-Content -LiteralPath VERSION -Value $tagVersion -NoNewline -Encoding utf8
          python empacotar_distribuicao.py --output dist/GacIA-source.zip
          Expand-Archive -LiteralPath dist/GacIA-source.zip -DestinationPath dist/stage -Force
          $releaseConfig = @{ github_repository = $env:GITHUB_REPOSITORY; release_channel = $releaseChannel } | ConvertTo-Json
          Set-Content -LiteralPath dist/stage/Gac.IA/release_config.json -Value $releaseConfig -Encoding utf8
          "APP_VERSION=$tagVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_CHANNEL=$releaseChannel" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler was not installed.' }
          & $compiler "/DAppVersion=$env:APP_VERSION" /DStageDir="..\dist\stage\Gac.IA" distribuicao/GacIA.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath 'dist/GacIA-Setup.exe')) { throw 'Installer EXE was not created.' }
          $hash = (Get-FileHash -LiteralPath 'dist/GacIA-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  GacIA-Setup.exe" | Set-Content -LiteralPath 'dist/GacIA-Setup.exe.sha256' -Encoding ascii

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v$env:APP_VERSION"
          $releaseArgs = @('release', 'create', $tag, 'dist/GacIA-Setup.exe', 'dist/GacIA-Setup.exe.sha256', '--title', "Gac.IA $tag", '--generate-notes')
          if ($env:RELEASE_CHANNEL -eq 'development') { $releaseArgs += '--prerelease' }
          gh @releaseArgs
